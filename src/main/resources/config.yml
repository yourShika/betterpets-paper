# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         BETTER PETS  ·  config.yml                          ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Every option is documented below. Missing options are added automatically ║
# ║  on start and your existing values are kept, so updates never wipe your     ║
# ║  settings. Sections:                                                        ║
# ║    1) Language      2) General (2b Quickslots)                              ║
# ║    3) Pet following & abilities                                             ║
# ║    4) XP & boosters 5) Flight         6) Pet sources                        ║
# ║    7) Broadcasts    8) Storage        9) 3D models                          ║
# ║   10) Modules      11) Auto-updater  12) Debug                              ║
# ╚══════════════════════════════════════════════════════════════════════════╝


# ═══ 1) LANGUAGE ════════════════════════════════════════════════════════════
# Language for ALL player-facing text. Bundled: en (English), de (Deutsch),
# pl (Polski). The actual text lives in plugins/BetterPets/lang/<code>.yml and
# can be freely edited (MiniMessage tags like <gradient:#a:#b>, <bold>, colours
# are supported). New keys are merged into your files on update, so custom text
# survives upgrades.
#   Change it here and run /pets reload, or switch live with:  /pets language <en|de|pl>
language: de


# ═══ 2) GENERAL ═════════════════════════════════════════════════════════════
# Cooldown (in ticks, 20 = 1 second) between opening the /pets menu.
open-cooldown-ticks: 20
# Maximum number of pets a single player can own.
max-pets-per-player: 45

# Sound played when a player clicks a button in any Better Pets menu.
# click-sound accepts a Minecraft sound key (e.g. ui.button.click, block.note_block.pling)
# or the enum-style name (UI_BUTTON_CLICK); set it to "none" to turn menu click sounds off.
gui:
  click-sound: ui.button.click
  click-volume: 0.4
  click-pitch: 1.3

# Pets you do NOT want in use on this server. List their ids exactly as in pets.yml
# (e.g. penguin, dragon). Default is empty = every pet is enabled.
# A disabled pet:
#   * never spawns again from ANY source (chests, vaults, trial spawners, fishing,
#     wandering traders, mob drops, /pets drop, ...);
#   * cannot be equipped/summoned - players who already own one keep it, but clicking
#     it in the menu does nothing;
#   * can still be converted back to an item and re-added to the /pets list, and can
#     still be traded - it just can't be used until you re-enable it here.
# Example:
#   disabled-pets:
#     - penguin
#     - dragon
disabled-pets: []


# ═══ 2b) QUICKSLOTS ═════════════════════════════════════════════════════════
# Quickslots let a player park pets in numbered slots and switch between them
# without opening the menu. Slots are filled with
#     /pets quick set <slot> [pet]      (no pet named = the pet that is out)
# or in the slot screen of the optional Fabric mod. A slot remembers the pet
# TYPE, so it keeps working after the pet was converted to an item and back.
quickslots:
  # Master switch for the whole feature.
  enabled: true
  # How many quickslots every player has (1 - 9).
  slots: 5
  # Minimum time (ticks, 20 = 1 second) between two quick switches.
  switch-cooldown-ticks: 10
  # Using the slot of the pet that is already out puts that pet away again.
  same-slot-puts-away: true

  # Guard against hammering the switch (a held key, a macro, a spammed command).
  # The cooldown above is the minimum gap between two switches; on top of it,
  # too many switches in a short time lock quick switching for a moment.
  spam-protection:
    enabled: true
    # More than this many switches inside the window ...
    max-switches: 8
    window-seconds: 10
    # ... lock quick switching for this long.
    lockout-seconds: 5

  # Which ways of switching are allowed on this server - turn off whatever you
  # do not want. Filling slots (/pets quick set|clear|list) always works.
  methods:
    # /pets quick <slot> | next | prev | off
    commands: true
    # Sneak and turn the mouse wheel to step through your quickslots.
    # NEEDS the PacketEvents plugin (2.13.0+ for Minecraft 26.2). Without it
    # this method simply stays off; nothing else is affected.
    sneak-scroll: true
    # The "Better Pets Quickslots" Fabric mod: freely bindable keys, a slot
    # screen and a Quickslots button in the /pets menu. Players without the
    # mod are not affected in any way.
    mod: true

  sneak-scroll:
    # Whether sneak+scroll starts switched on for players. Everyone can change
    # it for themselves with  /pets quick scroll on|off.  It only ever takes
    # over the wheel of players who have filled at least one quickslot.
    default-on: true


# ═══ 3) PET FOLLOWING & ABILITIES ═══════════════════════════════════════════
# How often (ticks) the active pet follows/updates. Lower = smoother, more CPU.
follow-update-ticks: 3
# How often (ticks) periodic pet abilities are applied.
ability-update-ticks: 100
# Follow behaviour of the active pet relative to the player.
follow-distance: 2.4
follow-height: 1.2
follow-side-offset: 0.75
follow-turn-speed-degrees: 6.0
# If the pet is further than this (blocks) from the player it teleports to catch up.
follow-teleport-distance: 24.0
# Interpolation duration (ticks) used when the pet display teleports.
follow-teleport-duration-ticks: 8
# How often (ticks) the Penguin re-scans nearby containers for its Treasure Sense
# glow. Higher = cheaper. Minimum 20 (once per second). The Ferret's ore glow
# re-scans on the same interval.
penguin-glow-update-ticks: 40

# Firefly hostile-mob spawn shield. Cancels NATURAL monster spawns within the
# radius of an active Firefly owner. Radius grows from the base up to the max
# as the pet levels. Set enabled: false to turn the shield off server-wide.
firefly:
  enabled: true
  spawn-protection-radius: 6.0
  spawn-protection-max-radius: 20.0

# Ferret ore sense. Only active while the owner holds a pickaxe; reveals ore up
# to diamond (never netherite) in a small radius. This caps how many ore blocks
# glow at once per owner (keeps the scan cheap and the reveal a hint, not a map).
ferret:
  max-glowing-ores: 24

# Mechanist tech sense reveals nearby (trial) spawners through walls for the owner.
# (The structure compass was removed in v1.15.2: locating every registered structure
# on the main thread caused server freezes.)

# Lion ground mount: right-click to ride (no level requirement, terrain only, no flight),
# forward to run, jump to hop over 1-block steps, sneak to dismount.
lion-ride-speed: 0.42
lion-jump: 0.55


# ═══ 4) XP & BOOSTERS ═══════════════════════════════════════════════════════
# Global pet XP multiplier. Higher = pets level faster. Range 0.1 - 5.0.
# (Admins can also change this live in /pets, and boosters stack on top of it.)
pet-xp-multiplier: 1.0
# Ceiling on the combined Booster x Ascension pet-XP speed-up, so the two never stack into an absurd
# rate (an x5 booster on a 5-star pet would otherwise be 6.5x). The global pet-xp-multiplier above is
# applied on top of this and is NOT part of the cap. Set high (e.g. 99) to effectively disable the cap.
xp-max-multiplier: 6.0
# Pet XP Booster settings.
#   max-minutes:           caps admin-created boosters and consumption.
#   broadcast-drops:       announce when a mob drops a booster.
#   broadcast-activations: announce when a player activates a booster.
xp-booster:
  max-minutes: 1440
  broadcast-drops: true
  broadcast-activations: true


# ═══ 4b) TOKENS & COSMETICS SHOP ════════════════════════════════════════════
# Duplicate pets, when scrapped (/pets scrap), grant tokens + a fusion star + the
# skin, all at once. Spend tokens in the cosmetics shop (/pets shop) on aura
# colours, trails, nametag styles, skins and XP boosters.
shop:
  # Minutes of duration for XP boosters bought in the shop.
  booster-minutes: 30
  # Token prices. booster-xN defaults to 15*(N-1) if omitted.
  price:
    particle: 10
    trail: 15
    nametag: 20
    skin: 12
    booster-x2: 20
    booster-x3: 35
    booster-x4: 55
    booster-x5: 80

tokens:
  enabled: true
  # Tokens earned when a pet of each rarity is scrapped.
  per-rarity:
    common: 1
    rare: 2
    epic: 3
    legendary: 4
    mythical: 5
  # Mining an ore has a small chance to drop a few tokens directly (survival/adventure only).
  # Only for an ore that is mined out: not with Silk Touch (the ore comes back as a block), not
  # for ancient debris, never for player-placed ores. Amount is a random min..max. broadcast
  # announces the find in chat.
  ore-tokens:
    enabled: true
    chance-percent: 3.0
    min: 1
    max: 5
    broadcast: true


# ═══ 5) FLIGHT ══════════════════════════════════════════════════════════════
# Used while riding a Dragon, Phoenix or Shadow Dragon at level 50+. You sit on
# the pet and steer it like a real mount: look where you want to go and hold
# forward, jump to climb, look down to dive, sneak to dismount. The mount moves
# by velocity every tick, so it stays smooth and collides with blocks.
#   flight-speed:          horizontal/forward flight speed in blocks per tick.
#   flight-speed-per-star: extra flight speed per Ascension star (0.08 = +8%/star,
#                          so a 5-star flying pet flies +40% faster). Set 0 to disable.
#   flight-lift:           extra upward speed while holding jump.
#   flight-pet-offset:     how far below the seat the pet body floats.
flight-speed: 0.6
flight-speed-per-star: 0.08
flight-lift: 0.5
flight-pet-offset: -0.4
# Highest Y a pet mount may fly to. There is no build-height cap - you can fly well
# above the world's max height (it is empty air up there). This is only a sanity
# ceiling; raise it if you want to fly even higher.
flight-max-height: 1024


# ═══ 6) PET SOURCES ═════════════════════════════════════════════════════════
# Where pets (and XP boosters) can be obtained. Toggle and tune each one live in
# /pets drop (admin). Each source has its own chance-percent (0 - 100).
# Base chance (percent) for a generated chest to contain a pet.
chest-pet-chance-percent: 2.5
pet-sources:
  # Chests use chest-pet-chance-percent above.
  chest:
    enabled: true
  # Chance to fish out a pet instead of the normal catch.
  fishing:
    enabled: true
    chance-percent: 1.0
  # Chance a spawning Wandering Trader carries a one-time pet deal.
  wandering-trader:
    enabled: true
    chance-percent: 25.0
  # Chance to brush a pet out of suspicious sand/gravel.
  brushing:
    enabled: true
    chance-percent: 1.5
  # Vaults and Trial Spawners (vanilla and data pack). ominous-bonus-percent is
  # added on top of chance-percent when the block is ominous (any level counts).
  vault:
    enabled: true
    chance-percent: 2.0
    ominous-bonus-percent: 3.0
  trial-spawner:
    enabled: true
    chance-percent: 1.5
    ominous-bonus-percent: 2.5
  # Chance a hostile mob drops a Pet XP Booster (x2-x5, 15/30/45/60 minutes).
  xp-booster:
    enabled: true
    chance-percent: 1.5


# ═══ 7) DISCOVERY BROADCASTS ════════════════════════════════════════════════
# Which rarities announce a find in chat. Players can mute these for themselves
# with /pets mute.
discovery-broadcasts:
  common: true
  rare: true
  epic: true
  legendary: true
  mythical: true


# ═══ 8) STORAGE & BACKUPS ═══════════════════════════════════════════════════
# How often (ticks) all pet data is auto-saved. Minimum 1200 (60s). Interactive
# changes are also saved automatically; this is the periodic safety net.
save-interval-ticks: 6000
storage:
  # Storage backend. "yaml" is the stable default and the only backend that ships
  # today. "sqlite" is NOT YET AVAILABLE - selecting it logs a warning and safely
  # keeps using the YAML store (with backups). Leave this as "yaml".
  type: yaml
  backup:
    # Master switch for automatic backups.
    enabled: true
    # Keep one dated copy of pets.yml per day in plugins/BetterPets/backups.
    daily: true
    # How many daily backups to keep before the oldest are pruned.
    keep-days: 14


# ═══ 9) 3D MODELS ═══════════════════════════════════════════════════════════
# Only used when the (experimental) BetterModel module is enabled. Drop .bbmodel
# files into plugins/BetterPets/models/ named after the pet id (e.g. dog.bbmodel).
# Vertical offset applied when a grounded model is snapped to the ground.
model-ground-offset: 0.05
# A pet whose model has a sleeping animation lies down and sleeps once its owner has neither moved
# nor looked around for this many seconds (or is in bed), and gets up when the owner is back.
model-sleep-after-seconds: 60
# The pet's name floats this far (blocks) above the top of its model.
model-nametag-gap: 0.3
# Height (blocks) of the name above the pet's feet, only for a model whose height is not known.
model-nametag-height: 2.6
# Extra yaw (degrees) if a model was built facing a different direction.
model-facing-yaw-offset-degrees: 0.0
# Per-pet model name overrides (petNameOrId -> modelFileName without .bbmodel).
# Without an entry here the model is found by its file name: the pet id, then the skin the pet wears
# (joined with one or two underscores), then optionally _grounded or _flying - cat.bbmodel,
# cat__black.bbmodel, allay_happy_flying.bbmodel. A skin without a model of its own uses the pet's.
model-overrides: {}
# Pets that use the _flying model where both a _grounded and a _flying one exist. All others walk.
model-flying-pets: [allay, bat, bee, firefly, pixie, guardian_angel, phoenix, ghast, owl, red_parrot,
  magpie, woodpecker, silk_moth, griffin, lich, reaper, kraken, blue_dragon, red_dragon, shadow_dragon,
  ender_dragon, elder_guardian, pufferfish, dolphin]
# Size of the models: one for all, and other sizes for single pets (by id) or single model files.
model-scale:
  default: 1.0
  pets: {}
  models: {}


# ═══ 10) MODULES ════════════════════════════════════════════════════════════
# External modules (e.g. BetterModel) are experimental. While this is false the
# /pets modules command is blocked and no external module can be activated.
experimental-modules: false

# Oraxen GUI skin (optional, cosmetic). When Oraxen is installed, Better Pets bundles custom menu
# backgrounds and control-button icons and deploys them into Oraxen automatically. Unlike the modules
# above this is safe, so it may run without experimental-modules. Needs one "/oraxen reload" after the
# first start (or after an update) so Oraxen rebuilds its resource pack. Works fine without Oraxen: the
# menus just use the normal vanilla items.
#   gui-enabled:    master switch for the whole Oraxen skin.
#   gui-background: draw the panel artwork behind each menu (font overlay).
#   gui-icons:      re-skin the control buttons with the custom icons.
# The panel/font overlay may need small offset tweaks in oraxen/pack/font/betterpets_menu.json for a
# pixel-perfect fit (then /oraxen reload) - the shipped values are a good starting point.
oraxen:
  gui-enabled: true
  gui-background: true
  gui-icons: true


# ═══ 11) AUTO-UPDATER ═══════════════════════════════════════════════════════
# Admin only (/pets update and the /pets version check). Downloading and staging
# a new jar is opt-in. While "enabled" is false the version check still tells you
# if a newer release exists, but nothing is downloaded. "repo" is the GitHub
# "owner/name" the release is pulled from; leave it blank to disable the
# update/version-check network calls entirely.
update:
  enabled: false
  repo: ""


# ═══ 12) DEBUG ══════════════════════════════════════════════════════════════
# Log extra info to the console (pet spawns, booster drops, etc.). Off by default
# to keep production consoles quiet; turn on when diagnosing an issue.
debug-logging: false
# Log each chest/vault/trial-spawner loot roll attempt (very verbose).
debug-loot-rolls: false


# ─── Messages / translations live in plugins/BetterPets/lang/ ───────────────
# See section 1 (Language). Any old "messages:" block here is migrated into the
# language files automatically on first start.
